# Paste these location blocks into the existing ithihasam.in server {} block,
# ABOVE any `location /` or proxy_pass rule. nginx matches `location =` exactly
# and prefers it over prefix and regex matches, so placement inside the block
# does not matter — but keeping them together at the top makes the intent clear.
#
# Problem being fixed:
#   https://ithihasam.in/robots.txt  -> Django 404 page (text/html)
#   https://ithihasam.in/sitemap.xml -> Django's sitemap with http:// URLs
#
# Both should be served as static files from the frontend build. Django's
# sitemap view is a fallback that predates the build-time generator; it emits
# URLs from SITE_URL, which was set to http://, so every entry conflicted with
# the https:// canonical tag on the corresponding page.

# --- Adjust this to your actual build output path -------------------------
# root /srv/apps/Ithihasam_frontend/dist;

# robots.txt: static file, never proxied.
location = /robots.txt {
    root /srv/apps/Ithihasam_frontend/dist;
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600";
    access_log off;
    try_files /robots.txt =404;
}

# llms.txt: plain-text brief for answer engines.
location = /llms.txt {
    root /srv/apps/Ithihasam_frontend/dist;
    default_type text/plain;
    add_header Cache-Control "public, max-age=3600";
    access_log off;
    try_files /llms.txt =404;
}

# Sitemap index plus its child sitemaps. The build writes:
#   sitemap.xml (index), sitemap-pages.xml, sitemap-services.xml,
#   sitemap-locations.xml, sitemap-local-services.xml, sitemap-articles.xml
# This regex takes precedence over the /sitemap.xml proxy to Django.
location ~ ^/sitemap(-[a-z-]+)?\.xml$ {
    root /srv/apps/Ithihasam_frontend/dist;
    default_type application/xml;
    add_header Cache-Control "public, max-age=3600";
    access_log off;
}

# RSS feed for the blog.
location = /feed.xml {
    root /srv/apps/Ithihasam_frontend/dist;
    default_type application/rss+xml;
    add_header Cache-Control "public, max-age=3600";
    access_log off;
}

# Web manifest and the pre-paint theme script.
location = /site.webmanifest {
    root /srv/apps/Ithihasam_frontend/dist;
    default_type application/manifest+json;
    access_log off;
}

# Pre-generated responsive WebP variants and social images.
location /og/ {
    root /srv/apps/Ithihasam_frontend/dist;
    expires 30d;
    add_header Cache-Control "public";
    access_log off;
}


# The Chalode area was published as /chalod (missing 'e'). The slug is now
# corrected everywhere, so the old URLs must redirect rather than 404 —
# Google has them indexed and external links may point at them.
location ~ ^/(.+)-chalod$ {
    return 301 /$1-chalode;
}

location = /locations/chalod {
    return 301 /locations/chalode;
}


# --- Compression ------------------------------------------------------------
# A site audit reported 184 uncompressed JS/CSS files. nginx gzips text/html by
# default but nothing else, so the 226 kB app bundle and 86 kB stylesheet were
# being sent raw. These types compress to roughly a third of their size, which
# is the single biggest transfer saving available here.
#
# Put these in the `http { }` block of /etc/nginx/nginx.conf, NOT inside a
# server block, so every site benefits and the settings are not duplicated.
#
#   gzip on;
#   gzip_vary on;
#   gzip_comp_level 6;
#   gzip_min_length 256;
#   gzip_proxied any;
#   gzip_types
#       text/plain text/css text/xml text/javascript
#       application/javascript application/json application/xml
#       application/rss+xml application/manifest+json
#       image/svg+xml font/woff font/woff2;
#
# text/html is always compressed by nginx and must not be listed again.

# --- HSTS -------------------------------------------------------------------
# Tells browsers to use https for this domain for a year, so a visitor typing
# the bare domain never makes an unencrypted request that could be intercepted.
#
# Add inside the 443 server block:
#
#   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
# Only enable `preload` once every subdomain is https-only: that submission is
# effectively irreversible.

# --- After adding the above -----------------------------------------------
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then confirm each returns a plain-text or XML body, not HTML:
#
#   curl -sI https://ithihasam.in/robots.txt  | head -3
#   curl -s  https://ithihasam.in/sitemap.xml | head -3
#
# sitemap.xml should now start with:
#   <?xml version="1.0" encoding="UTF-8"?>
#   <sitemapindex ...>
#
# If it still starts with <?xml version='1.0' ...?> and <urlset>, note the
# single quotes — that is Python's ElementTree, meaning Django is still
# answering and a proxy rule is matching ahead of these blocks.
#
# Optional: once these are confirmed working, the Django sitemap route can be
# removed from finorabackend/urls.py so there is only one sitemap in existence.
